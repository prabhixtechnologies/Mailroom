# Security headers are set here rather than only at the edge, so they hold whether a request arrives
# through Caddy or straight at the container.
#
# The CSP is tighter than the consoles' because Mailroom renders other people's HTML. `img-src` has to
# allow arbitrary hosts for remote images in mail to load at all; `script-src 'self'` is what stops a
# mail body that got past the sanitiser from executing anything.
map $sent_http_content_type $mailroom_csp {
    default "";
    ~*text/html "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: http:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:8080 http://localhost:8081 http://localhost:8083 https://api.prabhixtechnologies.com https://id.prabhixtechnologies.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy $mailroom_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Mail is not something search engines should be indexing, and this is belt and braces alongside the
    # meta tag: a robots meta tag only helps for documents a crawler renders.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $mailroom_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    # The entry document must never be cached. It names the content-hashed bundles, so a stale copy pins
    # the browser to an old build — and once those bundles age out of a later image it asks for filenames
    # that no longer exist and renders nothing at all. no-cache still allows a conditional request, so an
    # unchanged document costs a 304 rather than a download.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $mailroom_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Unhashed boot script. Must not inherit the immutable year-long cache used for Vite hashes.
    location = /theme-boot.js {
        add_header Cache-Control "no-cache" always;
    }

    # Safe to cache hard: Vite puts a content hash in every one of these filenames, so a changed file is
    # a different URL.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }
}
