<!doctype html>
<!--
  data-brand selects the generated token theme from web-kit/packages/brand/tokens.json:
  clay accent, teal partner accent, warm sand surfaces. Set here rather than from React so
  the first paint is already the right colour.
-->
<html lang="en" data-brand="mailroom" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#8c3b2a" />
    <meta name="description" content="Prabhix Mailroom — a calm desk for company communication." />
    <meta name="robots" content="noindex, nofollow" />
    <title>Prabhix Mailroom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
