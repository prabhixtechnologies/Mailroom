name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # The one web-kit commit this workflow uses, in both places it is needed: the job below clones
  # it so the token and literal gates run against it, and the image build vendors it as the
  # `webkit` build context because package.json file:-depends on it.
  #
  # A full commit SHA, never a branch — Infra/docs/DEPLOY.md requires it, so that two builds of
  # the same application commit cannot embed different versions of the shared OIDC client.
  #
  # One value because these were two values and they disagreed. The gate cloned the default
  # branch while the build context pinned a SHA, so once the pin went stale the gates were
  # passing against a web-kit that was not the one being shipped. That is how it broke: the apps
  # began importing toneFor and TAG_TONES, the pinned tree had neither, and the image build
  # failed on an import the job above it had just verified against a newer checkout. With one
  # value a stale pin fails at the gate, where the message names the missing token.
  #
  # Bumping it is deliberate, and deliberately manual. See DEPLOY.md, "What a push builds".
  WEBKIT_REF: db9d1918bb1552d35d7808022944fee30fe7f787

jobs:
  mail-server:
    name: Mail server (LMTP signing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LMTP signature contract
        run: python mail-server/lmtp-push/verify_sign.py

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          # A SHA, not a branch, so --branch and --depth-1-clone cannot fetch it directly.
          WEBKIT="$GITHUB_WORKSPACE/../web-kit"
          git init -q "$WEBKIT"
          git -C "$WEBKIT" remote add origin https://github.com/prabhixtechnologies/web-kit.git
          git -C "$WEBKIT" fetch -q --depth 1 origin "$WEBKIT_REF"
          git -c advice.detachedHead=false -C "$WEBKIT" checkout -q FETCH_HEAD
          npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Colours come from the generated tokens or they do not ship. The checker lives in web-kit
      # beside the tokens it enforces and is already cloned above, so there is one implementation
      # and adding an escape hatch does not mean a pull request per repository.
      #
      # Mailroom's two exceptions are both recorded in the source with a `px-allow-literal:`
      # comment: the theme-color meta tag, and the ink colour injected into the sandboxed iframe
      # that renders a message body, which by design cannot reach this app's stylesheet.
      - name: No hard-coded colours
        working-directory: ${{ github.workspace }}/../web-kit/packages/brand
        run: node scripts/check-literals.mjs

      - name: No double-encoded text
        working-directory: ${{ github.workspace }}/../web-kit/packages/brand
        run: node scripts/check-mojibake.mjs

      # Apps link @prabhix/ui with `file:`, and npm does not install a linked package's own
      # dependencies into the consumer. A missing one resolves at build time through the symlink
      # and fails under Vitest in whichever unrelated file imports the barrel first, so it is
      # worth catching here rather than there.
      - name: "@prabhix/ui peers declared by every app"
        working-directory: ${{ github.workspace }}/../web-kit/packages/brand
        run: node scripts/check-peers.mjs
      # The sanitiser tests are the ones worth failing a build over: Mailroom renders HTML an attacker
      # chose, and a regression there is a cross-site scripting hole in a mail client.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  image:
    name: Build and push image
    needs: [web, mail-server]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token AWS exchanges for temporary credentials below.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Amazon ECR is the only registry. The Docker Hub branch that used to sit here is gone, along
      # with the AWS_CI_ROLE_ARN variable that chose between them -- with one registry that variable
      # stopped being a cutover switch and became a way for this repository to be silently
      # misconfigured, because an unset variable meant "push somewhere else" rather than "fail".
      #
      # The role ARN is written here rather than read from a variable for the same reason, and the
      # account ID it contains is not a secret.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::029096972251:role/prabhix-github-ecr-push
          # Same region as the EC2 instance that pulls these, so a deploy is not billed as
          # inter-region transfer.
          aws-region: ap-south-1

      # No long-lived key: the role is assumed through GitHub's OIDC provider and the docker
      # credentials this produces expire in twelve hours.
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Taken from the ECR login rather than configured, so the account ID cannot drift from the
          # role that was actually assumed.
          #
          # Repositories are namespaced -- prabhix/mailroom -- and the slash is required rather than tidy:
          # the deployer policy scopes ECR to repository/prabhix/*, and that pattern only matches a
          # name containing a slash.
          echo "base=${{ steps.ecr.outputs.registry }}/prabhix" >> "$GITHUB_OUTPUT"

      - name: Build and push mailroom
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          build-contexts: |
            webkit=https://github.com/prabhixtechnologies/web-kit.git#${{ env.WEBKIT_REF }}
          push: true
          # Vite inlines these at build time; each must also be declared as an ARG in web/Dockerfile
          # or it is silently discarded and the image ships with the default.
          #
          # VITE_IDENTITY_ISSUER is required rather than optional here, unlike in the consoles: those
          # still have a password form to fall back on, and Mailroom does not. An image built without
          # it renders a "not configured" screen and nothing else.
          build-args: |
            VITE_API_URL=https://api.prabhixtechnologies.com
            VITE_IDENTITY_ISSUER=https://api.prabhixtechnologies.com
            VITE_ONEOPS_URL=https://oneops.prabhixtechnologies.com
          tags: |
            ${{ steps.meta.outputs.base }}/mailroom:latest
            ${{ steps.meta.outputs.base }}/mailroom:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
