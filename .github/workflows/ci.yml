name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The sanitiser tests are the ones worth failing a build over: Mailroom renders HTML an attacker
      # chose, and a regression there is a cross-site scripting hole in a mail client.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  image:
    name: Build and push image
    needs: [web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token AWS exchanges for temporary credentials below.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Amazon ECR is the only registry. The Docker Hub branch that used to sit here is gone, along
      # with the AWS_CI_ROLE_ARN variable that chose between them -- with one registry that variable
      # stopped being a cutover switch and became a way for this repository to be silently
      # misconfigured, because an unset variable meant "push somewhere else" rather than "fail".
      #
      # The role ARN is written here rather than read from a variable for the same reason, and the
      # account ID it contains is not a secret.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::029096972251:role/prabhix-github-ecr-push
          # Same region as the EC2 instance that pulls these, so a deploy is not billed as
          # inter-region transfer.
          aws-region: ap-south-1

      # No long-lived key: the role is assumed through GitHub's OIDC provider and the docker
      # credentials this produces expire in twelve hours.
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Taken from the ECR login rather than configured, so the account ID cannot drift from the
          # role that was actually assumed.
          #
          # Repositories are namespaced -- prabhix/mailroom -- and the slash is required rather than tidy:
          # the deployer policy scopes ECR to repository/prabhix/*, and that pattern only matches a
          # name containing a slash.
          echo "base=${{ steps.ecr.outputs.registry }}/prabhix" >> "$GITHUB_OUTPUT"

      - name: Build and push mailroom
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          # Vite inlines these at build time; each must also be declared as an ARG in web/Dockerfile
          # or it is silently discarded and the image ships with the default.
          #
          # VITE_IDENTITY_ISSUER is required rather than optional here, unlike in the consoles: those
          # still have a password form to fall back on, and Mailroom does not. An image built without
          # it renders a "not configured" screen and nothing else.
          build-args: |
            VITE_API_URL=https://api.prabhixtechnologies.com
            VITE_IDENTITY_ISSUER=https://api.prabhixtechnologies.com
            VITE_ONEOPS_URL=https://oneops.prabhixtechnologies.com
          tags: |
            ${{ steps.meta.outputs.base }}/mailroom:latest
            ${{ steps.meta.outputs.base }}/mailroom:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
