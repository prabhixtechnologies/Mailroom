name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# web-kit used to be pinned here as WEBKIT_REF, a commit SHA that the web job cloned so the gates
# could run against it and that the image build vendored as a `webkit` build context, because
# web/package.json file:-depended on it. The pin existed because those were once two separate
# values that disagreed: the gate cloned the default branch while the build context named a SHA,
# so a stale pin meant the gates were passing against a web-kit that was not the one being
# shipped.
#
# web/package-lock.json is that pin now. brand and oidc-client are ordinary versioned
# dependencies resolved from GitHub Packages, so the lockfile fixes one exact tarball of each for
# the gates, the tests and the image alike, and Dependabot can move it.

jobs:
  mail-server:
    name: Mail server (LMTP signing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LMTP signature contract
        run: python mail-server/lmtp-push/verify_sign.py

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    # Reading @prabhixtechnologies/* from GitHub Packages. The packages are public, so the
    # built-in token is enough and no PAT has to be stored in this repository.
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
          # Writes a runner-local .npmrc carrying NODE_AUTH_TOKEN. The committed web/.npmrc maps
          # the scope; this supplies the credential.
          registry-url: https://npm.pkg.github.com
          scope: "@prabhixtechnologies"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npx tsc --noEmit

      # Colours come from the generated tokens or they do not ship. The checker ships inside
      # @prabhixtechnologies/brand as a bin, so it arrives with the dependency and runs against
      # the same version the bundle is built from. There is one implementation, so adding an
      # escape hatch does not mean a pull request per repository.
      #
      # Mailroom's two exceptions are both recorded in the source with a `px-allow-literal:`
      # comment: the theme-color meta tag, and the ink colour injected into the sandboxed iframe
      # that renders a message body, which by design cannot reach this app's stylesheet.
      - name: No hard-coded colours
        run: npx prabhix-check-colours src

      - name: No double-encoded text
        run: npx prabhix-check-mojibake src

      # The peer-dependency gate that used to run here is gone with the `file:` link it existed
      # for. npm does not install a linked package's own dependencies into the consumer, so every
      # app had to redeclare @prabhixtechnologies/ui's peers by hand; a registry install resolves
      # them normally. This app does not consume the UI package.

      # The sanitiser tests are the ones worth failing a build over: Mailroom renders HTML an attacker
      # chose, and a regression there is a cross-site scripting hole in a mail client.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  image:
    name: Build and push image
    needs: [web, mail-server]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The image build installs @prabhixtechnologies/* from GitHub Packages.
      packages: read
      # Mints the OIDC token AWS exchanges for temporary credentials below.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Amazon ECR is the only registry. The Docker Hub branch that used to sit here is gone, along
      # with the AWS_CI_ROLE_ARN variable that chose between them -- with one registry that variable
      # stopped being a cutover switch and became a way for this repository to be silently
      # misconfigured, because an unset variable meant "push somewhere else" rather than "fail".
      #
      # The role ARN is written here rather than read from a variable for the same reason, and the
      # account ID it contains is not a secret.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::029096972251:role/prabhix-github-ecr-push
          # Same region as the EC2 instance that pulls these, so a deploy is not billed as
          # inter-region transfer.
          aws-region: ap-south-1

      # No long-lived key: the role is assumed through GitHub's OIDC provider and the docker
      # credentials this produces expire in twelve hours.
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Taken from the ECR login rather than configured, so the account ID cannot drift from the
          # role that was actually assumed.
          #
          # Repositories are namespaced -- prabhix/mailroom -- and the slash is required rather than tidy:
          # the deployer policy scopes ECR to repository/prabhix/*, and that pattern only matches a
          # name containing a slash.
          echo "base=${{ steps.ecr.outputs.registry }}/prabhix" >> "$GITHUB_OUTPUT"

      - name: Build and push mailroom
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          # GitHub Packages wants a token even for a public package. A BuildKit secret rather than
          # a build-arg: a build-arg is recorded in the image history and this image is pushed to
          # ECR. The Dockerfile writes and deletes the credential inside one RUN.
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          push: true
          # Vite inlines these at build time; each must also be declared as an ARG in web/Dockerfile
          # or it is silently discarded and the image ships with the default.
          #
          # VITE_IDENTITY_ISSUER is required rather than optional here, unlike in the consoles: those
          # still have a password form to fall back on, and Mailroom does not. An image built without
          # it renders a "not configured" screen and nothing else.
          build-args: |
            VITE_API_URL=https://api.prabhixtechnologies.com
            VITE_IDENTITY_ISSUER=https://identity.prabhixtechnologies.com
            VITE_ONEOPS_URL=https://oneops.prabhixtechnologies.com
          tags: |
            ${{ steps.meta.outputs.base }}/mailroom:latest
            ${{ steps.meta.outputs.base }}/mailroom:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
